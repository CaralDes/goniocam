# Construit l'application Android (APK) avec Capacitor.
# - Lancement manuel (onglet Actions) ou tag « v* » (ex. v0.4.0) : l'APK est joint à une release GitHub.
# - Signature release si les secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#   ANDROID_KEY_ALIAS et ANDROID_KEY_PASSWORD existent ; sinon APK de debug (installable, mais
#   chaque build a une clé différente : désinstaller avant de mettre à jour).
name: Application Android (APK)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Modèles MediaPipe officiels
        run: npm run models
      - name: Tests
        run: npm test
      - name: Version
        run: echo "VERSION_NAME=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
      - name: Build web (mode android) et synchronisation Capacitor
        run: npm run android:sync
      - name: Clé de signature
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/release.keystore
            echo "BUILD_TYPE=release" >> "$GITHUB_ENV"
          else
            echo "BUILD_TYPE=debug" >> "$GITHUB_ENV"
          fi
      - name: Gradle
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "$BUILD_TYPE" = release ]; then ./gradlew --no-daemon assembleRelease; else ./gradlew --no-daemon assembleDebug; fi
      - name: Renommer l'APK
        run: |
          APK=$(find android/app/build/outputs/apk -name '*.apk' | head -1)
          mkdir -p out && cp "$APK" "out/GonioCam-${VERSION_NAME}-${BUILD_TYPE}.apk"
          sha256sum out/*.apk | tee out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: GonioCam-apk
          path: out/
      - name: Release GitHub (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          body: |
            Application Android GonioCam ${{ env.VERSION_NAME }} (${{ env.BUILD_TYPE }}).
            Installation : télécharger l'APK sur le téléphone, autoriser l'installation depuis cette source, ouvrir le fichier.
            Traitement 100 % local ; outil d'aide à la mesure en cours de validation.
